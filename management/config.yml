backend:
  name: github
  repo: agungsempurno/website-FMBC
  branch: main
  base_url: https://fmbc-decap-auth.agungsempurno9-718.workers.dev
  auth_endpoint: auth

app_title: "FMBC Content Manager"
logo:
  src: "/asset/logo.png"
site_url: "https://farahmombabycare.com"
display_url: "https://farahmombabycare.com"

media_folder: "asset/uploads"
public_folder: "/asset/uploads"

collections:
  - name: "promo"
    label: "Promo"
    files:
      - file: "content/promo.json"
        label: "Popup Promo Utama"
        name: "promo"
        fields:
          - { label: "Judul Promo", name: "title", widget: "string", hint: "Muncul sebagai judul popup" }
          - { label: "Gambar Poster", name: "image", widget: "image", hint: "Upload gambar poster promo di sini" }
          - { label: "Aktifkan", name: "active", widget: "boolean", default: true }

  - name: "tim"
    label: "Tim Bidan & Therapist"
    files:
      - file: "content/therapists.json"
        label: "Daftar Tim Therapist"
        name: "tim"
        fields:
          - name: "therapists"
            label: "Anggota Tim"
            label_singular: "Therapist"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Nama", name: "name", widget: "string", hint: "Contoh: Bidan Farah Riyadi" }
              - { label: "Jabatan / Spesialis", name: "role", widget: "string", hint: "Muncul saat foto disentuh/di-hover" }
              - { label: "Foto", name: "photo", widget: "image" }
